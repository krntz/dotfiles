import = [
    "~/.config/alacritty/themes/catppuccin-mocha.toml"
]

live_config_reload = true

[cursor]
style = {blinking = "On", shape = "Block"}

[env]
TERM = "xterm-256color"

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 100000

[window]
dynamic_title = true
title = "Terminal"
padding.x = 10
padding.y = 10
opacity = 1
blur = true
