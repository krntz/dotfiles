import = [
    "~/.config/alacritty/themes/catppuccin-mocha.toml"
]

live_config_reload = true

[cursor]
style = {blinking = "Always", shape = "Underline"}

[env]
TERM = "xterm-256color"

[font]
size = 12
normal = {family = "JetBrainsMono Nerd Font", style = "Regular"}

[scrolling]
history = 100000

[window]
dynamic_title = true
dynamic_padding = true
padding = {x = 5, y = 5}
opacity = 1
blur = true
decorations = "Full"

[mouse]
hide_when_typing = true
